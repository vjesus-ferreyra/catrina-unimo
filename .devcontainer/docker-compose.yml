services:
  app:
    build:
      dockerfile: Dockerfile
    container_name: catrina
    depends_on:
          db:
            condition: service_healthy

  db:
      image: postgres:18
      container_name: db
      restart: always
      environment:
        POSTGRES_USER: usuario
        POSTGRES_PASSWORD: password123
        POSTGRES_DB: mibase
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      # El healthcheck le pregunta a Postgres si ya acepta conexiones
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U usuario -d mibase"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  pgdata:
